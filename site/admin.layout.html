<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | {app.site_name}</title>
    <link rel="stylesheet" href="/css/navigation.css" />
    <style>@view-transition { navigation: auto; } @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }</style>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body class="admin-shell m-0">
    <header class="site-header">
      <nav class="flex items-center gap-sm px-md py-sm">
        <a class="inline-flex items-center text-black no-underline" href="/">
          <img class="flea-logo" src="/images/logo-light.svg" width="166" height="40" alt="FleaCMS" />
        </a>
        <a class="ml-auto text-sm" href="/">Back to website</a>
        {#if admin.email}
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf" value="{admin.csrf}" />
          <button class="text-sm">Sign out</button>
        </form>
        {/if}
      </nav>
    </header>
    <main class="admin-main">{slot}</main>
    <script src="/js/header.js" defer></script>
  </body>
</html>
