<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>500 | Server error</title>
    <style>
      /* Self-contained: error rendering must not depend on site assets. */
      body { margin:0; background:#f5f9ff; color:#142b43; font:1rem/1.6 system-ui,sans-serif; }
      main { max-width:36rem; margin:12vh auto; padding:2rem; }
      h1 { font-size:clamp(1.75rem,5vw,2.5rem); line-height:1.2; letter-spacing:-.035em; }
      p { color:#4f657b; }
      a { color:inherit; text-underline-offset:.2em; }
      a:focus-visible { outline:2px solid currentColor; outline-offset:4px; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col bg-white">
    <main class="container">
      <h1>Server error</h1>
      <p>We've encountered an unexpected error. Please try again shortly.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
