<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{page.title} | {app.site_name}</title>
    <meta name="description" content="{page.description}" />
    <link rel="icon" href="/images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/global.css" />
    {#if app.current_admin}
    <meta name="csrf-token" content="{app.current_admin.csrf_token}" />
    {/if}
  </head>
  <body class="flex flex-col min-h-screen m-0 p-0">
    {#if app.current_admin}
    {render /admin/toolbar}
    {/if}
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="container flex items-center justify-between gap-sm" aria-label="Main navigation">
        <a class="wordmark inline-flex items-center text-black no-underline" href="/" aria-label="FleaCMS home"><img src="/images/mark.svg" width="48" height="48" alt="" /><span>FleaCMS</span></a>
        <div class="site-links flex items-center gap-md">{render /navigation}</div>
      </nav>
    </header>
    <main id="main" class="flex-1" tabindex="-1">{slot}</main>
    <footer class="site-footer container">
      <div><a class="wordmark" href="/">FleaCMS</a><p>Small websites. Room to make them yours.</p></div>
      <nav class="flex flex-wrap gap-md" aria-label="Footer navigation"><a href="/docs#release-notes">Release notes</a><a href="/docs#support">Support</a><a href="/admin">Owner sign-in</a></nav>
      <p class="copyright">&copy; 2026 FleaCMS</p>
    </footer>
  </body>
</html>
