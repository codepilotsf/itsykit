<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{page.title} | {app.site_name}</title>
    <meta name="description" content="{page.description}" />
    <link rel="canonical" href="https://fleacms.com{page.path}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FleaCMS" />
    <meta property="og:title" content="{page.title} | FleaCMS" />
    <meta property="og:description" content="{page.description}" />
    <meta property="og:url" content="https://fleacms.com{page.path}" />
    <meta property="og:image" content="https://fleacms.com/images/social-preview.png?v=e0aa7a43d50a" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FleaCMS: Write plain HTML. Flea builds the server. Terminal workflow from installation to HTTPS deployment." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{page.title} | FleaCMS" />
    <meta name="twitter:description" content="{page.description}" />
    <meta name="twitter:image" content="https://fleacms.com/images/social-preview.png?v=e0aa7a43d50a" />
    <meta name="twitter:image:alt" content="FleaCMS: Write plain HTML. Flea builds the server. Terminal workflow from installation to HTTPS deployment." />
    <link rel="stylesheet" href="/css/global.css" />
    {#if app.current_admin}
    <meta name="csrf-token" content="{app.current_admin.csrf_token}" />
    {/if}
    <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body class="flex flex-col min-h-screen m-0 p-0">
    {#if app.current_admin} {render /admin/toolbar} {/if}
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav
        class="container flex items-center justify-between"
        aria-label="Main navigation"
      >
        <a class="wordmark" href="/" aria-label="FleaCMS home"><img class="flea-logo" src="/images/logo.svg" width="166" height="40" alt="FleaCMS" /></a>
        <div class="site-links flex items-center gap-md">
          {render /navigation}
        </div>
      </nav>
    </header>
    <main id="main" class="flex-1" tabindex="-1">{slot}</main>
    <footer class="site-footer container">
      <div>
        <a class="wordmark" href="/"><img class="flea-logo" src="/images/logo.svg" width="166" height="40" alt="FleaCMS" /></a>
        <p>Plain HTML. Your own server. One binary.</p>
      </div>
      <nav class="flex flex-wrap gap-md" aria-label="Footer navigation">
        <a href="/docs#release-notes">Release notes</a
        ><a href="/docs#support">Support</a><a href="/admin">Admin sign-in</a>
      </nav>
      <p class="copyright">&copy; 2026 FleaCMS</p>
    </footer>
    <p id="copy-status" class="visually-hidden" role="status" aria-live="polite"></p>
    <script src="/js/copy.js" defer></script>
  </body>
</html>
