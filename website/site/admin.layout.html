<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | {app.site_name}</title>
    <link rel="icon" href="/images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body class="admin-shell m-0">
    <header class="bg-lighter border-b border-light">
      <nav class="flex items-center gap-sm px-md py-xs">
        <a class="inline-flex items-center text-black no-underline" href="/">
          <img src="/images/mark.svg" width="48" height="48" alt="" />
          <span class="text-lg font-semibold tracking-tight">FleaCMS</span>
        </a>
        <a class="ml-auto text-sm" href="/">Back to website</a>
        {#if admin.email}
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf" value="{admin.csrf}" />
          <button class="text-sm">Sign out</button>
        </form>
        {/if}
      </nav>
    </header>
    <main class="admin-main">{slot}</main>
  </body>
</html>
