<section class="container py-xl">
  <h1>Get in touch</h1>
  <p class="max-w-text">Tell us a little about what you have in mind.</p>
  <form method="post" action="/_flea/contact">
    <label class="form-field">Your name<input name="name" autocomplete="name" maxlength="100" required></label>
    <label class="form-field">Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
    <label class="form-field">Message<textarea name="message" maxlength="5000" required></textarea></label>
    <div hidden><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button type="submit">Send message</button>
  </form>
</section>
