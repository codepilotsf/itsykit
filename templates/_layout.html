<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{page.title} | {site.name}</title>
    <meta name="description" content="{page.description}" />
    <link rel="icon" href="/images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body class="flex flex-col min-h-screen m-0 p-0">
    <header class="sticky top-0 bg-lighter bg-opacity-80 backdrop-blur-sm">
      <nav class="container flex items-center gap-md">
        <a class="inline-flex items-center text-black no-underline" href="/">
          <img src="/images/mark.svg" width="48" height="48" alt="" />
          <span class="text-lg font-semibold tracking-tight">FleaCMS</span>
        </a>
        <a href="/test" class="no-underline">Test</a>
        <a
          href="/admin"
          class="ml-auto text-sm border-sm py-3xs px-xs rounded-sm hover:bg-white"
          >Admin</a
        >
      </nav>
    </header>
    <main class="flex-1 flex flex-col">{slot}</main>
    <footer class="container py-sm border-t border-light text-dark text-sm">
      &copy; 2026 Nobody
    </footer>
  </body>
</html>
