<div class="container py-lg">
  <p class="text-sm text-dark">EDIT YOUR WEBSITE</p>
  <h1>Sign in to {site.name}.</h1>
  <p>Use the email address your developer added for you. Sign in with an emailed code, with no password or separate account to create.</p>
  <form method="post" action="/admin/code">
    <input type="hidden" name="csrf" value="{admin.csrf}" />
    <label class="form-field">Email address
      <input type="email" name="email" autocomplete="email" maxlength="254" required autofocus />
    </label>
    <button>Send sign-in code</button>
  </form>
  <p>First time here? Ask your developer to add your email address. There is no public sign-up.</p>
  <p><a href="/">Back to website</a></p>
</div>
