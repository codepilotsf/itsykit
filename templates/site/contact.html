<section class="container py-xl contact-layout">
  <div>
    <h1 snip class="mt-0">Let's talk.</h1>
    <p snip class="text-lg text-dark max-w-text">
      Have a question or a project in mind? Tell us a little about it.
    </p>
    <div class="border-t border-light mt-lg pt-md">
      <h2 snip class="text-lg mt-0">A good place to start</h2>
      <p snip class="text-dark max-w-text">
        Share what you're working on, what you need, and any timing you have in
        mind.
      </p>
    </div>
  </div>
  <div class="bg-white border border-light rounded-lg p-lg">
    <h2 snip class="text-lg mt-0">Send us a message</h2>
    <p snip class="text-sm text-dark mb-md">All fields are required.</p>
    <form method="post" action="/_flea/contact" class="flex flex-col gap-md">
      <label class="form-field my-0 text-sm"
        >Your name<input
          name="name"
          autocomplete="name"
          maxlength="100"
          required
      /></label>
      <label class="form-field my-0 text-sm"
        >Email address<input
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          required
      /></label>
      <label class="form-field my-0 text-sm"
        >Message<textarea
          name="message"
          maxlength="5000"
          placeholder="How can we help?"
          required
        ></textarea>
      </label>
      <div hidden>
        <label
          >Leave this empty<input
            name="website"
            tabindex="-1"
            autocomplete="off"
        /></label>
      </div>
      <button type="submit" class="w-full ui-brand-1 text-white">
        Send message
      </button>
    </form>
  </div>
</section>
