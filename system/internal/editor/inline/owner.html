<dialog id="page-details" aria-labelledby="details-title"><form>
  <h2 id="details-title">Page details</h2><p>Included when you choose Save.</p>
  <label for="page-title">Page title</label><input id="page-title" maxlength="200">
  <label for="page-description">Description</label><textarea id="page-description" maxlength="500"></textarea>
  <div class="actions"><button type="button" class="text-button" id="details-cancel">Cancel</button><button type="submit">Done</button></div>
</form></dialog>
<div id="collection-overlays" hidden></div>
<p id="collection-status" class="sr-only" role="status" aria-live="polite"></p>
<dialog id="collection-photo-dialog" aria-labelledby="collection-photo-title"><form>
  <h2 id="collection-photo-title">Choose photo</h2>
  <div class="photo-library-heading"><p>Your photos</p><button type="button" id="collection-photo-upload">Upload photo</button></div>
  <input id="collection-photo" type="hidden">
  <input id="collection-photo-file" type="file" accept="image/jpeg,image/png" hidden>
  <p id="collection-photo-empty">No photos yet. Upload a JPEG or PNG to get started.</p>
  <div id="collection-photo-grid" role="group" aria-label="Photo library"></div>
  <div id="collection-photo-selection" hidden>
    <img id="collection-photo-preview" alt="Selected photo preview">
    <div><p id="collection-photo-name"></p><label for="collection-photo-alt">Alt text</label>
    <input id="collection-photo-alt" maxlength="500" aria-describedby="collection-photo-help">
    <p id="collection-photo-help">Describe the photo, or leave blank if decorative.</p></div>
  </div>
  <p class="photo-help">JPEG or PNG, up to 8 MiB. Done previews your choice; Save publishes it.</p>
  <p id="collection-photo-error" role="alert"></p>
  <div class="actions"><button type="button" class="text-button" id="collection-photo-cancel">Cancel</button><button type="submit">Done</button></div>
</form></dialog>
<dialog id="link-dialog" aria-labelledby="link-title"><form id="link-form" autocomplete="off">
  <h2 id="link-title">Edit link</h2><label for="link-url">Web address, email, phone, or relative path</label>
  <input id="link-url" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="https://example.com">
  <p id="link-error" role="alert"></p><label class="switch"><input type="checkbox" role="switch" id="link-new-tab">Open in a new tab</label>
  <button type="button" class="text-button" id="link-remove" hidden>Remove link</button>
  <div class="actions"><button type="button" class="text-button" id="link-cancel">Cancel</button><button type="submit">Apply link</button></div>
</form></dialog>
