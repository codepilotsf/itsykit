<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{page.title} | {app.site_name}</title>
    <meta name="description" content="{page.description}" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <style>@view-transition { navigation: auto; } @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }</style>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="icon" href="/images/favicon-32.png?v=itsykit-20261123" type="image/png" sizes="32x32" />
    <link rel="icon" href="/images/favicon.svg?v=itsykit-20261123" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=itsykit-20261123" sizes="180x180" />
  </head>
  <body class="flex flex-col min-h-screen m-0 p-0">
    <header class="sticky top-0 bg-lighter bg-opacity-80 backdrop-blur-sm">
      <nav class="container flex flex-wrap items-center gap-md py-xs">
        <a class="inline-flex items-center text-black no-underline" href="/">
          <img class="itsy-logo" src="/images/logo.svg?v=itsykit-20261123" width="132" height="37" alt="ItsyKit" />
        </a>
        <div class="desktop-navigation">{render /navigation}</div>

        <a
          href="/admin"
          class="ml-auto text-sm border border-light py-xs px-sm rounded-full hover:bg-white"
          >Admin</a
        >

        <button class="mobile-menu-toggle" popovertarget="mobile-navigation" aria-label="Open navigation"><span aria-hidden="true"></span></button>
        <div id="mobile-navigation" popover>
          <div class="flex items-center justify-between gap-md mb-md"><strong>Navigation</strong><button popovertarget="mobile-navigation" popovertargetaction="hide" aria-label="Close navigation">×</button></div>
          <nav aria-label="Mobile navigation">{render /navigation}<a href="/admin">Admin</a></nav>
        </div>
      </nav>
    </header>
    <main class="flex-1 flex flex-col">{slot}</main>
    <footer class="container py-sm border-t border-light text-dark text-sm">
      <span>&copy; 2026 Your business</span>
    </footer>
  </body>
</html>
