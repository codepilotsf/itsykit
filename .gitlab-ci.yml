stages: [servers, clients, publish]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$/'
    - when: never

servers:
  stage: servers
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  tags: ["linux-$ARCH"]
  script:
    - bash scripts/release.sh server "$ARCH"
  artifacts:
    paths: [dist/]
    expire_in: 30 days

clients:
  stage: clients
  needs: [servers]
  parallel:
    matrix:
      - ARCH: arm64
        RUNNER: macos-arm64
      - ARCH: amd64
        RUNNER: linux-amd64
  tags: ["$RUNNER"]
  script:
    - bash scripts/release.sh client "$ARCH"
  artifacts:
    paths: [dist/]
    expire_in: 30 days

publish:
  stage: publish
  tags: [linux-amd64]
  needs: [servers, clients]
  when: manual
  script:
    - bash scripts/stage-release.sh
  artifacts:
    paths: [dist/public/]
    expire_in: 30 days
